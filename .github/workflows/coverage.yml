name: coverage report flow

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scoped to the minimum needed to post a coverage comment on the pull request.
permissions:
    contents: read
    pull-requests: write

jobs:
    report-coverage:
        name: coverage report (informational)
        runs-on: ubuntu-latest

        env:
            NODE_ENV: test

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci

            # Informational only: a failing run must not block the merge or the report step.
            - name: Run tests with coverage
              continue-on-error: true
              run: npm run test:coverage

            - name: Report coverage on PR
              uses: davelosert/vitest-coverage-report-action@v2
              with:
                  name: 'Frontend coverage (unit + component + nuxt)'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  vite-config-path: ./vitest.config.ts
                  json-summary-path: ./coverage/coverage-summary.json
                  json-final-path: ./coverage/coverage-final.json
                  # Only the totals table; per-file details can exceed GitHub's comment size limit.
                  file-coverage-mode: none
