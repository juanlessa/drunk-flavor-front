name: codeql analysis

on:
    pull_request:
    schedule:
        # Weekly run so new CodeQL queries are applied even without a PR.
        - cron: '21 4 * * 1'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: analyze javascript/typescript
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Renovate PRs only change dependencies. Skipped jobs report success, so this is safe for required checks.
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}

        permissions:
            # Required to read the code being analyzed.
            contents: read
            # Required to upload the analysis results to the Security tab.
            security-events: write

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  build-mode: none

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:javascript-typescript'
