name: unit testing flow

on:
    push:
        branches:
            - 'releases/**'
            - 'master'
            - 'main'
            - 'develop'
    pull_request:

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run tests
              run: npm test
