name: Deploy frontend live

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: live-frontend-deployment
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-26.04-arm
        environment: live
        timeout-minutes: 20

        steps:
            - name: Check out the exact revision
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Confirm the runner is arm64
              run: |
                  set -Eeuo pipefail
                  test "$(uname -m)" = "aarch64"

            - name: Set up Node.js from the repository version
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install, verify, and build
              env:
                  NODE_ENV: production
                  NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
                  NUXT_PUBLIC_IMAGE_HOST: ${{ vars.NUXT_PUBLIC_IMAGE_HOST }}
                  NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
              run: |
                  set -Eeuo pipefail
                  # NODE_ENV=production (needed for the production CSP and parseEnvs)
                  # makes npm skip devDependencies by default, but the build tooling
                  # (tailwind, nuxt-security, vue-tsc, vitest, eslint) lives there.
                  # --include=dev installs them while keeping the prod build mode.
                  npm ci --include=dev
                  npm run lint
                  npm test
                  npm run build
                  printf 'aarch64\n' > .output/BUILD_ARCH

            - name: Create complete arm64 frontend runtime artifact
              run: |
                  set -Eeuo pipefail
                  test "$(uname -m)" = "aarch64"
                  test -f .output/server/index.mjs
                  test -d .output/server/node_modules
                  tar --create --gzip --file drunk-flavor-frontend-release.tar.gz .output
                  sha256sum drunk-flavor-frontend-release.tar.gz > drunk-flavor-frontend-release.tar.gz.sha256

            - name: Deploy frontend with verified SSH host key
              env:
                  DEPLOY_KEY: ${{ secrets.LIVE_DEPLOY_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.LIVE_SSH_KNOWN_HOSTS }}
                  LIVE_HOST: ${{ vars.LIVE_HOST }}
                  LIVE_SSH_PORT: ${{ vars.LIVE_SSH_PORT }}
                  LIVE_DEPLOY_USER: ${{ vars.LIVE_DEPLOY_USER }}
              run: |
                  set -Eeuo pipefail
                  install -d -m 0700 ~/.ssh
                  install -m 0600 /dev/null ~/.ssh/deploy_key
                  printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/deploy_key
                  install -m 0600 /dev/null ~/.ssh/known_hosts
                  printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
                  checksum="$(cut -d ' ' -f 1 drunk-flavor-frontend-release.tar.gz.sha256)"
                  test "${LIVE_DEPLOY_USER}" = "frontend-deployer"
                  ssh -i ~/.ssh/deploy_key \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o UserKnownHostsFile=~/.ssh/known_hosts \
                    -p "${LIVE_SSH_PORT}" \
                    "${LIVE_DEPLOY_USER}@${LIVE_HOST}" \
                    "deploy-frontend ${GITHUB_SHA} ${checksum}" < drunk-flavor-frontend-release.tar.gz
