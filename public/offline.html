<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#0B1220" />
		<title>Offline | DrunkFlavor</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: #0b1220;
				color: #f1f5f9;
				font-family:
					Roboto,
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				text-align: center;
			}
			main {
				max-width: 24rem;
			}
			img {
				width: 6rem;
				height: 6rem;
				margin-bottom: 1.5rem;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.5rem;
			}
			p {
				margin: 0 0 1rem;
				line-height: 1.5;
				color: #cbd5e1;
			}
			a {
				display: inline-block;
				margin-top: 0.5rem;
				padding: 0.75rem 1.5rem;
				border-radius: 0.5rem;
				background: #fed53a;
				color: #0b1220;
				font-weight: 700;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #f1f5f9;
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" width="96" height="96" />
			<h1>You are offline</h1>
			<p lang="en">Check your connection and try again.</p>
			<h1 lang="pt">Você está sem conexão</h1>
			<p lang="pt">Verifique sua conexão e tente novamente.</p>
			<a href="/">Try again / Tentar novamente</a>
		</main>
	</body>
</html>
